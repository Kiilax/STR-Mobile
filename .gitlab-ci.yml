include:
  - project: 'nidhoggr-25/str-ci'
    file:
      - '/.gitlab-ci-templates/lint.yml'
      - '/.gitlab-ci-templates/format.yml'
      - '/.gitlab-ci-templates/test.yml'
      - '/.gitlab-ci-templates/coverage.yml'
      - '/.gitlab-ci-templates/deps.yml'
      - '/.gitlab-ci-templates/sast.yml'
      - '/.gitlab-ci-templates/quality-pages.yml'
    ref: release


# Jobs lancés sur les branches feat/*, fix/*, chore/*, hotfix/*
format:
  extends: .format-template

lint:
  extends: .lint-template

test:
  extends: .test-template


# Jobs lancés uniquement sur release
test:coverage:
  extends: .coverage-template
  allow_failure: true

sec:deps:
  extends: .deps-template

sec:sast:
  extends: .sast-template

pages:quality:
  extends: .quality-pages-template


# Jobs lancés uniquement sur main/prod
build:apk:
  image: alpine:3.19
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""

  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|prod)$/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

  before_script:
    - apk add --no-cache docker-cli bash curl jq
    - docker version

  script:
    - docker rm -f apk_run_container 2>/dev/null || true
    - docker build -t apk-builder -f Dockerfile.prod .
    - rm -rf output/* || true
    - mkdir -p output
    - cid=$(docker create -e EXPO_TOKEN="${EXPO_TOKEN}" apk-builder)
    - docker start -a "$cid"
    - docker cp "$cid":/output/app.apk "$CI_PROJECT_DIR/output/app.apk"
    - docker rm -f "$cid" 2>/dev/null || true

  artifacts:
    paths:
      - output/app.apk
    name: "strm-apk-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days

  tags:
    - raspi
